    <circle cx="1090" cy="180" r="172" fill="none" stroke="#C4B5FD" stroke-opacity=".12" stroke-dasharray="3 11"/>
    <path d="M916 180H1264M1090 6V354" stroke="#CBD5E1" stroke-opacity=".12" stroke-dasharray="2 8"/>
  </g>
