    <path d="M0 -112 L98 -56 L98 56 L0 112 L-98 56 L-98 -56Z" fill="#0B1220" fill-opacity=".4" stroke="url(#edge)" stroke-opacity=".9" stroke-width="1.6"/>
    <path d="M0 -112 L98 -56 L0 0 L-98 -56Z" fill="url(#faceA)" stroke="#A5F3FC" stroke-opacity=".65"/>
    <path d="M-98 -56 L0 0 L0 112 L-98 56Z" fill="#0F2940" fill-opacity=".86" stroke="#67E8F9" stroke-opacity=".55"/>
    <path d="M98 -56 L0 0 L0 112 L98 56Z" fill="url(#faceB)" stroke="#C4B5FD" stroke-opacity=".7"/>
    <path d="M0 -112V0M0 0V112" stroke="#E0F2FE" stroke-opacity=".35"/>
    <path d="M-98 -56L0 0L98 -56" fill="none" stroke="#E0F2FE" stroke-opacity=".34"/>
    <circle cx="0" cy="0" r="7" fill="#E0F2FE"/>
  </g>
  <g fill="#A5F3FC" opacity=".85">
