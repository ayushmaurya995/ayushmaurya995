    </filter>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#020617" flood-opacity=".7"/>
    </filter>
  </defs>
  <rect width="1440" height="390" rx="26" fill="url(#bg)"/>
  <rect width="1440" height="390" rx="26" fill="url(#grid)"/>
  <ellipse cx="1120" cy="190" rx="310" ry="230" fill="url(#glowC)" filter="url(#blur)"/>
  <ellipse cx="1300" cy="330" rx="260" ry="180" fill="url(#glowV)" filter="url(#blur)"/>
  <path d="M0 320 C260 270 430 420 700 330 S1120 270 1440 335" fill="none" stroke="#67E8F9" stroke-opacity=".12" stroke-width="1.5"/>
  <path d="M0 344 C270 292 450 438 730 350 S1150 290 1440 355" fill="none" stroke="#A78BFA" stroke-opacity=".11" stroke-width="1.5"/>
  <g opacity=".65">
