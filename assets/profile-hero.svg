<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="390" viewBox="0 0 1440 390" role="img" aria-labelledby="title desc">
  <title id="title">Ayush Maurya — Developer Profile</title>
  <desc id="desc">A dark editorial developer banner with a subtle technical grid, cyan and violet lighting, and a geometric glass prism.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset=".52" stop-color="#111A2E"/>
      <stop offset="1" stop-color="#17112B"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset=".55" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="faceA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9" stop-opacity=".74"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="faceB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="glowC">
      <stop offset="0" stop-color="#0891B2" stop-opacity=".32"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".28"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94A3B8" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
