    <text x="0" y="78" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="-2">AYUSH MAURYA</text>
    <rect x="2" y="103" width="62" height="3" rx="1.5" fill="url(#edge)"/>
    <text x="0" y="151" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="1.5">FULL-STACK DEVELOPER  /  DATA ANALYST</text>
    <text x="0" y="185" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="16">Building products. Finding insights. Creating impact.</text>
  </g>
  <g transform="translate(92 335)" font-family="monospace" font-size="11" fill="#64748B" letter-spacing="2">
    <text>ENGINEERING</text><circle cx="116" cy="-4" r="2" fill="#67E8F9"/>
    <text x="132">ANALYTICS</text><circle cx="240" cy="-4" r="2" fill="#A78BFA"/>
    <text x="256">PRODUCT THINKING</text>
  </g>
  <rect x=".75" y=".75" width="1438.5" height="388.5" rx="25.25" fill="none" stroke="#CBD5E1" stroke-opacity=".18" stroke-width="1.5"/>
