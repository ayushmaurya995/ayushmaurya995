  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A5F3FC"/><stop offset=".45" stop-color="#22D3EE"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#DDD6FE"/><stop offset=".5" stop-color="#A78BFA"/><stop offset="1" stop-color="#6D28D9"/></linearGradient>
  <linearGradient id="glassA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67E8F9" stop-opacity=".3"/><stop offset="1" stop-color="#2563EB" stop-opacity=".035"/></linearGradient>
  <linearGradient id="glassB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C4B5FD" stop-opacity=".28"/><stop offset="1" stop-color="#6D28D9" stop-opacity=".035"/></linearGradient>
