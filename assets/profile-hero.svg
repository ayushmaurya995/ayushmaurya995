  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.2" cy="1.2" r=".8" fill="#A5F3FC" fill-opacity=".26"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#020617" flood-opacity=".7"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
