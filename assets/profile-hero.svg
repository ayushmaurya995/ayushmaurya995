<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Ayush Maurya — Developer, Analyst, Product Thinker</title>
<desc id="desc">A cinematic dark portfolio banner with a precision grid, layered glass geometry and an illuminated three-dimensional AM monogram.</desc>
<defs>
